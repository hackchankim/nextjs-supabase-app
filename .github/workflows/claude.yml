name: Claude Code

# 이슈/PR 코멘트에 @claude 를 멘션하면 Claude 가 분석·구현하고 브랜치+PR 을 만든다.
#
# ⚠️ 현재 비활성화됨(workflow_dispatch 수동 전용) — Claude Code GitHub App 미설치로
#    자동 실행 시 "Claude Code is not installed on this repository" 오류가 나기 때문.
#    재활성화하려면: ① https://github.com/apps/claude 에서 App 설치
#    ② repo Secrets 에 ANTHROPIC_API_KEY 등록 ③ 아래 on: 을 원래 트리거로 복원
#       (issue_comment/pull_request_review_comment/issues). 로컬 /dev:auto-dev 로도
#       code-reviewer·qa-tester 리뷰가 이뤄지므로 이 클라우드 트랙은 선택 사항이다.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # @claude 가 포함된 이벤트에만 실행
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 20"
