name: Claude PR Review

# PR 이 열리거나 갱신될 때 Claude 가 변경분을 자동으로 코드리뷰하고 코멘트를 남긴다.
#
# ⚠️ 현재 비활성화됨(workflow_dispatch 수동 전용) — Claude Code GitHub App 미설치로
#    자동 실행 시 "Claude Code is not installed on this repository" 오류가 나기 때문.
#    재활성화하려면: ① https://github.com/apps/claude 에서 App 설치
#    ② repo Secrets 에 ANTHROPIC_API_KEY 등록 ③ 아래 on: 을 pull_request(opened/synchronize)로 복원.
#    로컬 /dev:auto-dev 의 code-reviewer 가 이미 정적 리뷰를 수행하므로 선택 사항이다.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            이 PR의 변경분을 정확성·버그·회귀 위주로 한국어로 리뷰해 주세요.
            코드 스타일보다 실제 동작(런타임 오류, 엣지 케이스, 보안, 시크릿 노출)에 집중하고,
            문제는 파일:라인과 함께 구체적으로 지적한 뒤 요약 코멘트를 남겨 주세요.
            프로젝트 규칙은 CLAUDE.md / shrimp-rules.md 를 따릅니다.
          claude_args: "--max-turns 15"
